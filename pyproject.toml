[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-desktop"
version = "2.1.0"
description = "High-throughput local HTTPS/WSS/HTTP smart DPI & DoH proxy with a Warm Ceramic Qt Quick desktop UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.7",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "PyInstaller>=6.0",
]

[project.scripts]
relay = "relay.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
